name: Research backtest (BTC / PAXG / XAU)

# Manual only. Downloads public 1m candles on the runner (which has internet), runs the train/test grid,
# writes a report to the job summary and uploads grids as an artifact. No orders, no secrets.
on:
  workflow_dispatch:
    inputs:
      assets:
        description: "Binance symbols, space separated"
        default: "BTCUSDT PAXGUSDT"
      days:
        description: "History length in days"
        default: "180"
      profile:
        description: "small = 15m sweeps (tight stops) | big = 1h sweeps + 4h RSI (wide stops)"
        default: "small"
      warmup_days:
        description: "Extra days fetched before the window for indicator warm-up (no trades)"
        default: "0"
      min_trades:
        description: "Minimum trades per part for a config to count"
        default: "30"
      xau_csv_url:
        description: "Optional URL of an XAUUSD 1m CSV (timestamp,open,high,low,close[,volume])"
        default: ""

permissions:
  contents: write   # only to publish the report to the 'results' branch

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ASSETS: ${{ inputs.assets }}
      DAYS: ${{ inputs.days }}
      PROFILE: ${{ inputs.profile }}
      WARMUP: ${{ inputs.warmup_days }}
      MIN_TRADES: ${{ inputs.min_trades }}
      XAU_URL: ${{ inputs.xau_csv_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run research
        run: |
          for v in "$DAYS" "$WARMUP" "$MIN_TRADES"; do case "$v" in ''|*[!0-9]*) echo "days/warmup/min_trades must be numbers"; exit 1;; esac; done
          case "$PROFILE" in small|big) ;; *) echo "profile must be small or big"; exit 1;; esac
          if ! [[ "$ASSETS" =~ ^[A-Z0-9\ ]+$ ]]; then echo "bad assets"; exit 1; fi
          ARGS=""
          if [ -n "$XAU_URL" ]; then
            curl -fsSL "$XAU_URL" -o xau_1m.csv
            ARGS="--csv XAUUSD=xau_1m.csv"
            ASSETS="$ASSETS XAUUSD"
          fi
          python -m app.research --assets $ASSETS --days "$DAYS" --warmup "$WARMUP" --profile "$PROFILE" --min-trades "$MIN_TRADES" $ARGS --out results
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: results/
      - name: Publish report to the results branch
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r results/. /tmp/pub/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan results
          git rm -rfq .
          git clean -fdxq
          cp -r /tmp/pub/. .
          git add -A
          git commit -qm "Research results (run $GITHUB_RUN_ID)"
          git push -f origin results
