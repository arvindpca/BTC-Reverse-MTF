name: Research backtest (BTC / PAXG / XAU)

# Manual only. Downloads public 1m candles on the runner (which has internet), runs the train/test grid,
# writes a report to the job summary and uploads grids as an artifact. No orders, no secrets.
on:
  workflow_dispatch:
    inputs:
      assets:
        description: "Binance symbols, space separated"
        default: "BTCUSDT PAXGUSDT"
      days:
        description: "History length in days"
        default: "180"
      xau_csv_url:
        description: "Optional URL of an XAUUSD 1m CSV (timestamp,open,high,low,close[,volume])"
        default: ""

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ASSETS: ${{ inputs.assets }}
      DAYS: ${{ inputs.days }}
      XAU_URL: ${{ inputs.xau_csv_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run research
        run: |
          case "$DAYS" in ''|*[!0-9]*) echo "days must be a number"; exit 1;; esac
          if ! [[ "$ASSETS" =~ ^[A-Z0-9\ ]+$ ]]; then echo "bad assets"; exit 1; fi
          ARGS=""
          if [ -n "$XAU_URL" ]; then
            curl -fsSL "$XAU_URL" -o xau_1m.csv
            ARGS="--csv XAUUSD=xau_1m.csv"
            ASSETS="$ASSETS XAUUSD"
          fi
          python -m app.research --assets $ASSETS --days "$DAYS" $ARGS --out results
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: results/
