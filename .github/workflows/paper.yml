name: PAXG paper trading (log only)

# Hourly paper-trading log of candidate v2. It recomputes everything from public candles, places NO orders and uses no secrets.
# State (the start time) and the report live on the 'paper-state' branch.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a test Telegram message (checks the secrets) and stop"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Telegram test
        if: ${{ inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from app.notify import send_telegram as s; ok=s('PAXG paper trading: Telegram alert test OK. Entry/exit alerts yahan aayenge.'); print('sent' if ok else 'NOT sent: check the two secrets'); raise SystemExit(0 if ok else 1)"
      - name: Restore state
        run: |
          mkdir -p paper_out
          if git fetch -q origin paper-state 2>/dev/null; then
            git show origin/paper-state:state.json > paper_out/state.json 2>/dev/null || rm -f paper_out/state.json
          fi
      - name: Run paper log
        if: ${{ !inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m app.paper_run --symbol PAXGUSDT --state paper_out/state.json --out paper_out
          cat paper_out/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish state and report
        if: ${{ !inputs.test_telegram }}
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r paper_out/. /tmp/pub/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan paper-state
          git rm -rfq .
          git clean -fdxq
          cp -r /tmp/pub/. .
          git add -A
          git commit -qm "Paper log $(date -u +%FT%H:%MZ)"
          git push -f origin paper-state
