name: 5m confirmation backtest
on:
  push:
    branches:
      - feature/5m-confirmation
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/5m-backtest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/5m-confirmation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Run BTC and PAXG 180-day research grid
        run: |
          python -m app.research --assets BTCUSDT PAXGUSDT --days 180 --warmup 30 --profile small --min-trades 20 --out results
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: 5m-confirmation-180d-results
          path: results/
