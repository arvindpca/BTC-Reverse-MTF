name: Strategy search (BTC + PAXG)

# Manual only. Fetches public 1m candles on the runner, tries several strategy families with a train/test split,
# pools BTC+PAXG, publishes the report to the 'search-results' branch. No orders, no secrets.
on:
  workflow_dispatch:
    inputs:
      assets:
        description: "Binance symbols, space separated"
        default: "BTCUSDT PAXGUSDT"
      days:
        description: "Traded window in days"
        default: "180"
      warmup_days:
        description: "Extra days before the window for indicator warm-up (no trades)"
        default: "20"
      min_trades:
        description: "Minimum pooled trades per part"
        default: "40"

permissions:
  contents: write   # only to publish the report branch

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ASSETS: ${{ inputs.assets }}
      DAYS: ${{ inputs.days }}
      WARMUP: ${{ inputs.warmup_days }}
      MIN_TRADES: ${{ inputs.min_trades }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run search
        run: |
          for v in "$DAYS" "$WARMUP" "$MIN_TRADES"; do case "$v" in ''|*[!0-9]*) echo "numbers only"; exit 1;; esac; done
          if ! [[ "$ASSETS" =~ ^[A-Z0-9\ ]+$ ]]; then echo "bad assets"; exit 1; fi
          python -m app.search --assets $ASSETS --days "$DAYS" --warmup "$WARMUP" --min-trades "$MIN_TRADES" --out search_out
          cat search_out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish report to the search-results branch
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r search_out/. /tmp/pub/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan search-results
          git rm -rfq .
          git clean -fdxq
          cp -r /tmp/pub/. .
          git add -A
          git commit -qm "Search results (run $GITHUB_RUN_ID)"
          git push -f origin search-results
