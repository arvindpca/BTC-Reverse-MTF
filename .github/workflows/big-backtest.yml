name: Big-timeframe strategy research
on:
  push:
    branches:
      - feature/5m-confirmation
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/big-backtest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/5m-confirmation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Run 180-day big-timeframe research
        run: |
          python -m app.research --assets BTCUSDT PAXGUSDT --days 180 --warmup 30 --profile big --min-trades 10 --out results
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: big-timeframe-180d-results
          path: results/
