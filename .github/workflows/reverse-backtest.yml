name: Reverse BUY-SELL 180-day research
on:
  push:
    branches:
      - research/reverse-buy-sell-180d
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/reverse-backtest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reverse-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reverse-buy-sell-180d
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Run 180-day BUY-SELL reversed research
        run: |
          python -m app.research --assets BTCUSDT PAXGUSDT --days 180 --warmup 30 --profile reverse --min-trades 20 --out results
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-buy-sell-180d-results
          path: results/
          if-no-files-found: error
